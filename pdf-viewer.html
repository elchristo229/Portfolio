<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Document PDF</title>
  <style>
    :root { color-scheme:dark; }
    * { box-sizing:border-box; }
    body { margin:0; background:#202124; color:#fff; font-family:Arial,sans-serif; }
    header { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:#111; position:sticky; top:0; z-index:2; }
    h1 { font-size:15px; font-weight:500; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    a { color:#fff; text-decoration:none; border:1px solid #777; padding:8px 13px; font-size:13px; margin-left:8px; }
    #pages { width:min(900px,100%); margin:24px auto; }
    canvas { display:block; width:100%; height:auto; margin:0 auto 20px; background:#fff; box-shadow:0 4px 16px #0008; }
    #status { text-align:center; color:#bbb; padding:50px 20px; }
    @media(max-width:600px){ header{padding:0 10px} header div{white-space:nowrap} a{padding:7px 8px;font-size:11px} #pages{margin:12px 8px} }
  </style>
</head>
<body>
  <header><h1 id="title">Document PDF</h1><div><a id="download" download>Télécharger</a><a href="index.html">Retour au portfolio</a></div></header>
  <div id="status">Chargement du document...</div>
  <main id="pages"></main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    const title = params.get('title') || 'Document PDF';
    document.title = title;
    document.getElementById('title').textContent = title;
    document.getElementById('download').href = file || '#';
    const status = document.getElementById('status');
    if (!file) { status.textContent = 'Document introuvable.'; } else {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      pdfjsLib.getDocument(file).promise.then(async pdf => {
        status.remove();
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const viewport = page.getViewport({ scale: 1.35 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          document.getElementById('pages').appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }
      }).catch(error => { status.textContent = `Impossible d'afficher ce PDF : ${error.message}`; });
    }
  </script>
</body>
</html>
